<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fdf6e3" />
    <title>ScribbleRig</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Default OpenGraph preview for the bare homepage. The worker's per-scene
      handlers (`/?s=…`, `/s/<id>`) append their own og:* tags to <head>;
      crawlers honour the last matching tag, so the per-scene image wins on
      share URLs without us stripping these defaults first.
    -->
    <meta property="og:title" content="ScribbleRig" />
    <meta property="og:description" content="A sharable physics sandbox in your browser. Build, play, and share!" />
    <meta property="og:image" content="https://scribblerig.josnun.com/og-default.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ScribbleRig" />
    <meta name="twitter:description" content="A sharable physics sandbox in your browser. Build, play, and share!" />
    <meta name="twitter:image" content="https://scribblerig.josnun.com/og-default.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mynerve&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
